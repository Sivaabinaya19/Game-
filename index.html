<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Spark</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body>
    <div class="home-container">
        <h1>Brain Spark</h1>
        <p class="subtitle">Choose your favorite game and start playing!</p>

        <div class="game-container">
        <div  class="game-card">
            <div class="game-icon">
                <img src="Images/wordsearchlogo.png" alt="Word Search Game Logo">
            </div>
            <h2>Word Search</h2>
            <p>Find hidden words in the letter grid.</p>
            <a href="wordsearch.html" class="play-btn">Play Now →</a>
        </div>
        <div class="game-card">
            <div class="game-icon">
                <img src="Images/memoryfliplogo.jpg" alt="Memory Flip Game Logo">
            </div>
            <h2>Memory Flip</h2>
            <p>Flip cards and match the identical pairs.</p>
            <a href="memoryflip.html" class="play-btn">Play Now →</a>
        </div>
        <div class="game-card">
            <div class="game-icon">
                <img src="Images/molelogo.png" alt="Memory Flip Game Logo">
            </div>
            <h2>Whac-a-Mole</h2>
            <p>FInd the mole and Get More Points</p>
            <a href="ratFinder.html" class="play-btn">Play Now →</a>
        </div>
    </div>
</body>
</html>
